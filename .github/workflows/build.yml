name: Android CI Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 强制重建合法gradle wrapper 8.7，兜底修复jar缺失
      - name: Prepare valid Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          # 写入properties，锁定8.7
          cat > gradle/wrapper/gradle-wrapper.properties <<PROP
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
PROP
          # 下载官方原版wrapper jar
          wget -q -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Qs-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
